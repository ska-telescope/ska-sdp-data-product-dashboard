[project]
name = "ska-dataproduct-dashboard"
description = "Data Product Dashboard"
license = "BSD-3-Clause"
version = "0.19.0"
authors = [{name="SKA SDP Developers"}]

requires-python = '>=3.14,<4.0'

[dependency-groups]
docs = [
    "sphinx >=9.1.0,<10.0.0",
    "ska-ser-sphinx-theme >=0.2.1,<0.3.0",
    "sphinx-copybutton >=0.5.2,<0.6.0",
    "sphinx-new-tab-link >=0.8.2,<0.9.0",
    "recommonmark >=0.7.1,<0.8.0",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[[tool.poetry.source]]
name = "skao"
url = "https://artefact.skao.int/repository/pypi-internal/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
